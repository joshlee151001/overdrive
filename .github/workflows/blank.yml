function rollDrop(ev){
  const ch=place===1?0.5:place<=3?0.3:0.12;if(Math.random()>ch)return null;
  const tier=(ev.final?3:ev.city.need>=12?2:ev.city.need>=5?1:0);
  const w=[70-tier*12,25+tier*7,5+tier*5],t=Math.random()*(w[0]+w[1]+w[2]),rar=t<w[0]?0:t<w[0]+w[1]?1:2;
  const pool=SPECIALS.filter(s=>s.rar===rar),it=pool[Math.floor(Math.random()*pool.length)];
