    const L=myLook();
    work=`<div class="cos"><h3>도색</h3><div class="sw">${PAINTS.map(col=>`<button type="button" style="background:${col}" data-act="paint" data-v="${col}" aria-label="색 ${col}" aria-pressed="${col===L.color}"></button>`).join('')}</div><div class="sub">${FINISHES.map(f=>`<button type="button" data-act="finish" data-v="${f.k}" aria-pressed="${f.k===L.finish}">${f.n}</button>`).join('')}</div></div>
    <div class="cos"><h3>휠</h3><div class="sub">${WHEELS.map(f=>`<button type="button" data-act="wheel" data-v="${f.k}" aria-pressed="${f.k===L.wheel}">${f.n}</button>`).join('')}</div><div class="sw">${RIMS.map(col=>`<button type="button" style="background:${col}" data-act="rim" data-v="${col}" aria-label="휠 색 ${col}" aria-pressed="${col===L.rim}"></button>`).join('')}</div></div>
    <div class="cos"><h3>스티커 무늬</h3><div class="sub">${STICKERS.map(f=>`<button type="button" data-act="sticker" data-v="${f.k}" aria-pressed="${f.k===L.sticker}">${f.n}</button>`).join('')}</div><div class="sw">${STCOL.map(col=>`<button type="button" style="background:${col}" data-act="stcol" data-v="${col}" aria-label="스티커 색 ${col}" aria-pressed="${col===L.stickColor}"></button>`).join('')}</div></div>
    <div class="cos" style="border-bottom:0"><h3>넘버판</h3><div class="plate-row"><input id="plateIn" maxlength="8" value="${esc(st.plate)}" aria-label="넘버판 글자"><div class="plate" id="platePrev">${esc(st.plate)||'&nbsp;'}</div></div><p class="keys">최대 8글자. 레이스할 때 차 뒤에 보여.</p></div>`;
  }
  $('#pGarage').innerHTML=`<div class="garage">
    <div class="bay"><canvas id="gCar" width="760" height="330"></canvas>
      <div class="carname"><span class="cls ${c.cls}">${c.cls}</span><b>${esc(c.name)}</b><span class="pr">PR <b>${s.pr}</b></span></div>
      <dl class="spec">${statRows(id)}</dl>
      <h3>내 차</h3>${ownedChips('usecar')}</div>
    <div class="work"><div class="sub">${[['perf','성능 튜닝'],['spec','특수 부품'],['cos','꾸미기']].map(t=>`<button type="button" data-act="gtab" data-v="${t[0]}" aria-pressed="${gTab===t[0]}">${t[1]}</button>`).join('')}</div><div>${work}</div></div></div>`;
  drawGarageCar();
}
function studio(g,w,h){const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0c1119');bg.addColorStop(0.7,'#141b27');bg.addColorStop(0.71,'#1a2130');bg.addColorStop(1,'#090c12');g.fillStyle=bg;g.fillRect(0,0,w,h);const sp=g.createRadialGradient(w/2,h*0.8,10,w/2,h*0.8,w*0.5);sp.addColorStop(0,'rgba(255,122,26,.16)');sp.addColorStop(1,'rgba(255,122,26,0)');g.fillStyle=sp;g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=1;for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(w/2+i*24,h*0.71);g.lineTo(w/2+i*120,h);g.stroke()}}
function drawGarageCar(){const cvs=$('#gCar');if(!cvs)return;const g=cvs.getContext('2d');studio(g,cvs.width,cvs.height);drawCarSide(g,cvs.width/2,cvs.height*0.86,cvs.width*0.74,myLook());g.font="italic 800 22px 'Saira Condensed','IBM Plex Sans KR',sans-serif";g.fillStyle='rgba(233,238,246,.45)';g.textAlign='left';g.textBaseline='alphabetic';g.fillText(save.owned[save.cur].plate||'',16,30)}
function renderShow(){
  if(!showBrand){
    $('#pShow').innerHTML=`<h2>쇼룸</h2><p class="keys">제조사를 골라.</p><div class="brands">${BRANDS.map(b=>{const list=CARS.filter(c=>c.brand===b.id),own=list.filter(c=>save.owned[c.id]).length,openN=list.filter(c=>OPENCLS.includes(c.cls)||save.owned[c.id]).length;
      return`<button type="button" class="brand-t ${openN?'':'lockb'}" data-act="brand" data-v="${b.id}"><canvas width="560" height="220" data-bcar="${list[list.length-1].id}"></canvas><span class="bd"><span class="bn">${b.name}</span><span class="bs">${b.sub}</span><span class="bm"><span>${list.length}대 · 보유 ${own}대</span>${openN?'<span class="btn sm primary">둘러보기 ▸</span>':'<span class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>전부 잠김</span>'}</span></span></button>`}).join('')}</div>`;
    document.querySelectorAll('#pShow canvas[data-bcar]').forEach(cvs=>{const id=cvs.dataset.bcar,g=cvs.getContext('2d'),st=save.owned[id]||newCar(id);studio(g,cvs.width,cvs.height);drawCarSide(g,cvs.width/2,cvs.height*0.86,cvs.width*0.76,{body:CAR[id].body,color:st.paint.color,finish:st.paint.finish,sticker:st.sticker.style,stickColor:st.sticker.color,wheel:st.wheel.style,rim:st.wheel.color})});
    return;
  }
  const B0=BRANDS.find(b=>b.id===showBrand);
  $('#pShow').innerHTML=`<div class="showhead"><button class="btn sm" type="button" data-act="brandback">◂ 제조사</button><h2>${B0.name}</h2><span class="keys">${B0.sub}</span></div>${['D','C','B','A','S'].map(cl=>{const list=CARS.filter(c=>c.cls===cl&&c.brand===showBrand);if(!list.length)return'';const open=OPENCLS.includes(cl);return`<div class="sec"><h3><span class="cls ${cl}">${cl}</span>&nbsp; ${cl}등급 · ${list.length}대${open?'':' · 잠김'}</h3><div class="cars">${list.map(c=>{const own=!!save.owned[c.id],cur=save.cur===c.id,lk=!own&&!OPENCLS.includes(c.cls),s=carStats(c.id,own?undefined:newCar(c.id));
    return`<div class="car ${cur?'cur':''} ${lk?'locked':''}"><canvas width="500" height="220" data-car="${c.id}"></canvas><div class="bd"><div class="nm"><span class="cls ${c.cls}">${c.cls}</span><b>${esc(c.name)}</b><span class="pr" style="margin-left:auto">PR <b style="font-size:20px">${s.pr}</b></span></div><p class="ds">${esc(c.desc)}</p>
    <div class="kv"><span>최고속도<b>${Math.round(s.top)}</b></span><span>0→200<b>${s.t200.toFixed(1)}s</b></span><span>접지<b>${s.grip.toFixed(2)}</b></span></div>
    <div class="ft"><span class="price">${own?'보유 중':c.price?won(c.price)+' CR':'기본 지급'}</span>${lk?'<span class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>잠김</span>':cur?'<span class="keys">타는 중</span>':own?`<button class="btn sm" type="button" data-act="usecar" data-v="${c.id}">이 차 타기</button>`:`<button class="btn buy" type="button" data-act="buycar" data-v="${c.id}" ${save.money<c.price?'disabled':''}>구매</button>`}</div></div></div>`}).join('')}</div></div>`}).join('')}`;
  document.querySelectorAll('#pShow canvas[data-car]').forEach(cvs=>{const id=cvs.dataset.car,g=cvs.getContext('2d'),st=save.owned[id]||newCar(id);studio(g,cvs.width,cvs.height);drawCarSide(g,cvs.width/2,cvs.height*0.85,cvs.width*0.8,{body:CAR[id].body,color:st.paint.color,finish:st.paint.finish,sticker:st.sticker.style,stickColor:st.sticker.color,wheel:st.wheel.style,rim:st.wheel.color})});
}
function renderShop(){
  $('#pShop').innerHTML=`<p class="keys">특수 부품은 같은 종류 부품 칸에 끼울 수 있어. 칸은 차고에서 부품을 LV2, LV4, LV6까지 강화하면 열려. 레이스에서 좋은 순위를 하면 가끔 공짜로 떨어져.</p>
  <div class="shop">${PARTS.map(p=>`<div class="pgrp"><h4>${p.name}</h4>${SPECIALS.filter(s=>s.cat===p.k).map(s=>`<div class="pitem"><span class="n"><span class="rar r${s.rar}">${RAR[s.rar].name}</span> ${esc(s.name)}</span><span class="e">${s.eff} · 보유 ${save.inv[s.id]||0}개</span><button class="btn buy sm" type="button" data-act="buyitem" data-v="${s.id}" ${save.money<RAR[s.rar].price?'disabled':''}>${won(RAR[s.rar].price)}</button></div>`).join('')}</div>`).join('')}</div>`;
}
function renderPrep(){
  const ev=EVENTS[save.ev],s=carStats(save.cur),km=trackKm(ev),cls=s.pr>=ev.rec?'good':s.pr>=ev.rec*0.9?'warnc':'badc';
  $('#prepWrap').innerHTML=`<header class="top"><div class="brand"><h3>${esc(ev.city.name)} · ${ev.final?'리그 최종전':'레이스 '+(ev.idx+1)}</h3><h2 style="font-size:clamp(34px,6vw,54px)">${esc(ev.name)}</h2><small>${esc(ev.sub)}</small></div><button class="btn" type="button" data-act="hub">◂ 리그</button></header>
    <div class="prepgrid"><div><small>트랙 길이</small><b>${km.toFixed(1)} km × ${ev.laps}랩</b></div><div><small>노면 접지</small><b>${ev.grip.toFixed(2)}×</b></div><div><small>1위 상금</small><b style="color:var(--warn)">${won(ev.prize)}</b></div><div><small>권장 PR</small><b>${ev.rec}</b></div><div><small>내 차 PR</small><b class="${cls}">${s.pr}</b></div><div><small>최고 기록</small><b>${save.career[ev.id]?fmt(save.career[ev.id].best):'-'}</b></div></div>
    <div class="sec"><h3>차 선택</h3>${ownedChips('prepcar')}</div>
    <div class="sec"><h3>타이어</h3><div class="cards">${Object.entries(TIRES).map(([k,t])=>`<button class="card" type="button" data-act="tire" data-v="${k}" aria-pressed="${k===tire}"><span class="t"><span class="tdot" style="color:${t.color}"></span>${t.name}</span><span class="s">${t.desc}</span><span class="row">접지력 <b>${Math.round(t.grip*100)}%</b></span><span class="row">마모 속도 <b>×${t.wear}</b></span></button>`).join('')}</div></div>
    <div class="note">${esc(ev.hint)}</div>
    <div class="cta"><button class="btn primary" type="button" data-act="start">출발 ▸</button></div>
    <p class="keys"><kbd>←</kbd> <kbd>→</kbd> 핸들 · <kbd>↓</kbd> 브레이크 (핸들이랑 같이 누르면 드리프트) · <kbd>Space</kbd> 니트로 · <kbd>Esc</kbd> 일시정지. 드리프트하거나 아슬아슬하게 추월하면 니트로가 차.</p>`;
}

function renderSettings(){
  const st=save.settings,opt=(k,v,label)=>`<button type="button" data-act="set" data-v="${k}:${v}" aria-pressed="${String(st[k])===String(v)}">${label}</button>`;
  $('#pSet').innerHTML=`<h2>설정</h2>
  <div class="setlist">
    <div class="setrow"><div><b>소리</b><small>레이스 중 엔진 소리</small></div><div class="sub">${opt('sound',true,'켜짐')}${opt('sound',false,'꺼짐')}</div></div>
    <div class="setrow"><div><b>화면 흔들림</b><small>부딪힐 때 화면이 흔들려</small></div><div class="sub">${opt('shake',true,'켜짐')}${opt('shake',false,'꺼짐')}</div></div>
    <div class="setrow"><div><b>그래픽 품질</b><small>느리면 보통으로 바꿔 봐. 시야 거리랑 해상도가 줄어.</small></div><div class="sub">${opt('quality','high','높음')}${opt('quality','normal','보통')}</div></div>
  </div>
  <div class="sec"><h3>조작법</h3><div class="ctrl">
    <span><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd></span><span>핸들</span>
    <span><kbd>↓</kbd> 또는 <kbd>S</kbd></span><span>브레이크. 핸들이랑 같이 누르면 드리프트</span>
    <span><kbd>Space</kbd> <kbd>↑</kbd> <kbd>Shift</kbd></span><span>니트로</span>
    <span><kbd>Esc</kbd> 또는 <kbd>P</kbd></span><span>일시정지</span>
    <span>폰</span><span>화면 아래 버튼으로 조작해. 가로로 눕히는 게 편해.</span>
  </div></div>
  <div class="danger"><div><b>세이브 초기화</b><p class="keys">상금, 산 차, 튜닝, 특수 부품, 리그 기록이 전부 지워지고 처음부터 시작해.</p></div>
    ${resetAsk?`<div class="cta" style="justify-content:flex-start"><b class="badc">정말 지울까? 되돌릴 수 없어.</b><button class="btn red sm" type="button" data-act="resetyes">전부 지우기</button><button class="btn sm" type="button" data-act="resetno">취소</button></div>`:`<div><button class="btn sm" type="button" data-act="reset">초기화</button></div>`}</div>
  <p class="keys">OVERDRIVE v0.3 · 한국 리그 · 저장 데이터는 이 브라우저에만 남아.</p>`;
}

/* ---------- actions */
const curSt=()=>save.owned[save.cur];
function cosChanged(){persist();LOOK=myLook();renderGarage()}
const ACT={
  tab:v=>{if(v==='show')showBrand=null;setTab(v)},
  brand:v=>{showBrand=v;renderShow();$('#sHub').scrollTop=0},brandback:()=>{showBrand=null;renderShow()},
  world:()=>{leagueOpen=false;setTab('world')},
  league:()=>{leagueOpen=true;setTab('world')},
  event:v=>{save.ev=v;persist();attract(EVENTS[v]);renderPrep();show('sPrep');$('#sPrep').scrollTop=0},
  hub:()=>{leagueOpen=true;attract();show('sHub');setTab('world')},
  tire:v=>{tire=v;save.tire=v;persist();renderPrep()},
  prepcar:v=>{save.cur=v;persist();attract();renderPrep()},
  usecar:v=>{save.cur=v;persist();attract();renderAll()},
  start:startRace,again:startRace,
  resume:()=>resume(),quit:()=>ACT.hub(),
  gtab:v=>{gTab=v;picking=null;renderGarage()},
  upg:v=>{const st=curSt(),lv=st.lv[v],c=tuneCost(save.cur,lv);if(lv>=MAXLV||save.money<c)return;save.money-=c;st.lv[v]=lv+1;persist();PST=carStats(save.cur);renderAll()},
  slot:v=>{const[cat,i]=v.split(':');picking=picking&&picking.cat===cat&&picking.i===+i?null:{cat,i:+i};renderGarage()},
  equip:v=>{if(!picking||!(save.inv[v]>0))return;const st=curSt(),old=st.slots[picking.cat][picking.i];if(old)save.inv[old]=(save.inv[old]||0)+1;save.inv[v]--;st.slots[picking.cat][picking.i]=v;picking=null;persist();PST=carStats(save.cur);renderAll()},
  unequip:()=>{if(!picking)return;const st=curSt(),old=st.slots[picking.cat][picking.i];if(old){save.inv[old]=(save.inv[old]||0)+1;st.slots[picking.cat][picking.i]=null}picking=null;persist();PST=carStats(save.cur);renderAll()},
  paint:v=>{curSt().paint.color=v;cosChanged()},finish:v=>{curSt().paint.finish=v;cosChanged()},
  wheel:v=>{curSt().wheel.style=v;cosChanged()},rim:v=>{curSt().wheel.color=v;cosChanged()},
  sticker:v=>{curSt().sticker.style=v;cosChanged()},stcol:v=>{curSt().sticker.color=v;cosChanged()},
  buycar:v=>{const c=CAR[v];if(save.owned[v]||save.money<c.price||!OPENCLS.includes(c.cls))return;save.money-=c.price;save.owned[v]=newCar(v);save.cur=v;persist();attract();renderAll()},
  set:v=>{const[k,val]=v.split(':');const st=save.settings;st[k]=val==='true'?true:val==='false'?false:val;persist();
    if(k==='sound')syncMute();if(k==='quality'){DRAW=st.quality==='high'?240:160;resize()}renderSettings()},
  reset:()=>{resetAsk=true;renderSettings()},resetno:()=>{resetAsk=false;renderSettings()},
  resetyes:()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()},
  buyitem:v=>{const p=RAR[SPEC[v].rar].price;if(save.money<p)return;save.money-=p;save.inv[v]=(save.inv[v]||0)+1;persist();renderAll()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='plateIn'){const v=e.target.value.slice(0,8);curSt().plate=v;persist();LOOK=myLook();$('#platePrev').textContent=v||' ';drawGarageCar()}});
$('#pauseBtn').onclick=pause;
function syncMute(){muted=!save.settings.sound;$('#muteBtn').textContent=muted?'소리 꺼짐':'소리 켜짐'}
syncMute();
$('#muteBtn').onclick=()=>{save.settings.sound=!save.settings.sound;persist();syncMute()};

/* ---------- input */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'brake',KeyS:'brake',Space:'nitro',ShiftLeft:'nitro',ShiftRight:'nitro',ArrowUp:'nitro',KeyW:'nitro'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='paused')resume();else pause();return}
  const k=KEYMAP[e.code];if(k&&(state==='race'||state==='count')){keys[k]=1;e.preventDefault()}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=0});
document.querySelectorAll('.touch button').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}},off=()=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- boot */
function resize(){DPR=Math.min(window.devicePixelRatio||1,save.settings.quality==='high'?1.5:1);W=cv.width=Math.max(1,Math.round(cv.clientWidth*DPR));H=cv.height=Math.max(1,Math.round(cv.clientHeight*DPR));buildBg()}
addEventListener('resize',resize);
resize();attract();show('sHub');setTab('world');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(tab==='world'&&!leagueOpen)drawWorld();drawGarageCar()});
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(state!=='paused'){update(dt);render()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
