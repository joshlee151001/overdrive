    const dy=LH*0.82,t1=LW*0.32,t2=LW*0.58;fg.fillStyle='#1c1430';fg.fillRect(LW*0.12,dy,LW*0.66,3*DPR);
    for(const tx of[t1,t2])fg.fillRect(tx-2*DPR,dy-LH*0.42,4*DPR,LH*0.42);
    fg.strokeStyle='rgba(255,220,170,.55)';fg.lineWidth=1*DPR;fg.beginPath();fg.moveTo(LW*0.12,dy);fg.quadraticCurveTo((LW*0.12+t1)/2,dy-LH*0.05,t1,dy-LH*0.42);fg.quadraticCurveTo((t1+t2)/2,dy+LH*0.1,t2,dy-LH*0.42);fg.quadraticCurveTo((t2+LW*0.78)/2,dy-LH*0.05,LW*0.78,dy);fg.stroke();
    for(let x=LW*0.12,i=0;x<LW*0.78;x+=5*DPR,i++){fg.fillStyle=['#ff6ad5','#6ae0ff','#ffe36a'][i%3];fg.fillRect(x,dy-1*DPR,2*DPR,2*DPR)}
