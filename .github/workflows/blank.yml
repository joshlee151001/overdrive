function paint(c,L,y0,y1,adj){
  const col=L.color,g=c.createLinearGradient(0,y0,0,y1),a=adj||0;
  if(L.finish==='matte'){g.addColorStop(0,shade(col,clamp(0.06+a,-1,1)));g.addColorStop(1,shade(col,-0.32))}
  else if(L.finish==='metal'){g.addColorStop(0,shade(col,0.55));g.addColorStop(0.28,col);g.addColorStop(0.5,shade(col,0.28));g.addColorStop(0.62,a<0?shade(col,-0.1):col);g.addColorStop(1,shade(col,-0.55))}
  else if(L.finish==='pearl'){g.addColorStop(0,mix(col,'#e6f0ff',0.6));g.addColorStop(0.45,mix(col,'#f4e6ff',0.18));g.addColorStop(1,shade(col,-0.42))}
  else{g.addColorStop(0,shade(col,0.35));g.addColorStop(0.45,a<0?shade(col,-0.15):col);g.addColorStop(1,shade(col,-0.5))}
  return g;
}
