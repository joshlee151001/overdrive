function bonus(st){const b={};for(const p of PARTS)b[p.k]=0;for(const k in st.slots)for(const it of st.slots[k])if(it&&SPEC[it])b[k]+=SPEC[it].val;return b}
function carStats(id,st){
  st=st||save.owned[id];const c=CAR[id],l=st.lv,b=bonus(st);
  const top=c.top*(1+0.035*l.engine)*(1+b.engine);
  const t200=c.t200/((1+0.06*l.weight)*(1+b.weight)*(1+0.05*l.trans)*(1+b.trans));
  const grip=c.grip*(1+0.05*l.grip)*(1+b.grip)*(1+0.015*l.weight);
  const nitroPow=c.nitro+0.025*l.turbo+b.turbo;
  const drain=0.34-0.018*l.turbo;
  const drift=(1-0.1*l.brake)*(1-b.brake);
  const brake=1+0.1*l.brake;
  const aero=(1-0.05*l.aero)*(1-b.aero);
  const pr=Math.round(top*1.6+900/t200+grip*120+(nitroPow-1)*300+(1-aero)*200+(1-drift)*100-120);
  return{top,t200,grip,nitroPow,drain,drift,brake,aero,pr,max:U(top),accel:U(200)/t200};
}
