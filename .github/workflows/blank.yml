}
const findSeg=z=>segs[((Math.floor(z/SEG)%segs.length)+segs.length)%segs.length];

/* ---------- backgrounds */
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return c}
function ridge(c,LW,LH,col,minH,maxH,seed){
  const r=rng(seed),k=[];for(let i=1;i<=7;i++)k.push({f:i+Math.floor(r()*3)*i,a:1/(i*0.8),p:r()*6.28});
  const sum=k.reduce((s,o)=>s+o.a,0),g=c.getContext('2d');
  g.fillStyle=col;g.beginPath();g.moveTo(0,LH);
  for(let x=0;x<=LW;x+=2){let v=0;for(const o of k)v+=o.a*Math.sin(o.f*x/LW*Math.PI*2+o.p);v=0.5+0.5*v/sum;g.lineTo(x,LH-(minH+(maxH-minH)*v)*LH)}
  g.lineTo(LW,LH);g.closePath();g.fill();
}
function skyline(g,LW,LH,r,col,minH,maxH,minW,maxW,winA,neon){
  for(let x=0;x<LW;){const bw=(minW+r()*(maxW-minW))*DPR,bh=(minH+r()*(maxH-minH))*LH;g.fillStyle=col;g.fillRect(x,LH-bh,bw,bh);
    if(winA)for(let wy=LH-bh+4*DPR;wy<LH-4;wy+=6*DPR)for(let wx=x+3*DPR;wx<x+bw-3*DPR;wx+=6*DPR)if(r()<winA){g.fillStyle=r()<0.7?'rgba(255,210,122,.55)':'rgba(140,210,255,.5)';g.fillRect(wx,wy,2*DPR,2*DPR)}
    if(neon&&r()<0.35){g.fillStyle=r()<0.5?'#ff3fa4':'#3fd7ff';g.globalAlpha=0.85;g.fillRect(x+bw*0.15,LH-bh+6*DPR,bw*0.7,2.5*DPR);g.globalAlpha=1}
    x+=bw+r()*8*DPR}
}
