function render(){
  if(!segs.length||!W)return;
  ctx.save();
  if(shake>0&&!reduceMotion&&save.settings.shake)ctx.translate((Math.random()-0.5)*shake*24*DPR,(Math.random()-0.5)*shake*16*DPR);
  const base=findSeg(position),basePct=(position%SEG)/SEG,pz=position+playerZ,pSeg=findSeg(pz),pPct=(pz%SEG)/SEG;
  const pY=lerp(pSeg.p1.world.y,pSeg.p2.world.y,pPct);
  drawBg(pY);
  let maxy=H,x=0,dx=-(base.curve*basePct);const camX=playerX*ROADW,camY=pY+CAMH;
  for(let n=0;n<DRAW;n++){
    const s=segs[(base.index+n)%segs.length];s.looped=s.index<base.index;const t=n/DRAW;s.fog=1/Math.exp(t*t*FOG);s.clip=maxy;
    const cz=position-(s.looped?trackLen:0);project(s.p1,camX-x,camY,cz);project(s.p2,camX-x-dx,camY,cz);x+=dx;dx+=s.curve;
    if(s.p1.camera.z<=camDepth||s.p2.screen.y>=s.p1.screen.y||s.p2.screen.y>=maxy)continue;
    drawSegment(s);maxy=s.p1.screen.y;
  }
  for(let n=DRAW-1;n>0;n--){
    const s=segs[(base.index+n)%segs.length];if(s.p1.camera.z<=camDepth)continue;
    for(const sp of s.sprites){if(sp.type==='gate'){drawGate(s,s.clip);continue}const sc=s.p1.screen.scale,k=sc*W/2;if(k*200<0.5)continue;drawSprite(sp,s.p1.screen.x+sc*sp.offset*ROADW*W/2,s.p1.screen.y,k,s.clip,s)}
    for(const c of s.cars){const pct=(c.z%SEG)/SEG,sc=lerp(s.p1.screen.scale,s.p2.screen.scale,pct);const cx=lerp(s.p1.screen.x,s.p2.screen.x,pct)+sc*c.offset*ROADW*W/2,cy=lerp(s.p1.screen.y,s.p2.screen.y,pct);
      ctx.save();ctx.beginPath();ctx.rect(0,0,W,s.clip);ctx.clip();ctx.globalAlpha=clamp(s.fog*1.3,0,1);drawCarRear(ctx,cx,cy,sc*CARW*W/2,c.look,{night:theme.night});ctx.restore()}
  }
  for(const p of particles){if(p.spark)continue;ctx.globalAlpha=(1-p.life/p.max)*0.45;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  const ps=camDepth/playerZ,pw=ps*CARW*W/2;
  let py=H/2-ps*lerp(pSeg.p1.camera.y,pSeg.p2.camera.y,pPct)*H/2;
  py=Math.min(py,H)-H*0.015+(offroad?(Math.random()-0.5)*4*DPR:Math.sin(clock*38)*Math.min(speed/B,1)*0.8*DPR);
  ctx.save();ctx.translate(W/2,py);ctx.rotate(steerVis*(drifting?0.06:0.02));
  drawCarRear(ctx,0,0,pw,LOOK||myLook(),{steer:steerVis,brake:keys.brake&&state==='race',night:theme.night,nitro:nitroOn});
  ctx.restore();
  for(const p of particles){if(!p.spark)continue;ctx.fillStyle=p.c;ctx.globalAlpha=1-p.life/p.max;ctx.fillRect(p.x,p.y,p.r*2,p.r*2)}ctx.globalAlpha=1;
  if(nitroOn&&!reduceMotion){ctx.strokeStyle='rgba(200,240,255,.35)';ctx.lineWidth=2*DPR;ctx.beginPath();for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,r1=Math.max(W,H)*(0.35+Math.random()*0.2),r2=r1+Math.max(W,H)*0.25;ctx.moveTo(W/2+Math.cos(a)*r1,H*0.45+Math.sin(a)*r1*0.7);ctx.lineTo(W/2+Math.cos(a)*r2,H*0.45+Math.sin(a)*r2*0.7)}ctx.stroke()}
  ctx.restore();
}

