    fg.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<14;i++){const cx=r()*LW,cy=LH*(0.05+r()*0.35),s=(20+r()*50)*DPR;for(let j=0;j<4;j++){fg.beginPath();fg.ellipse(cx+j*s*0.4,cy+(j%2)*s*0.08,s*0.4,s*0.16,0,0,7);fg.fill()}}
    for(let x=-50;x<LW;){const w=(60+r()*120)*DPR,h=(0.15+r()*0.35)*LH;ng.fillStyle=r()<0.5?'#5f9a49':'#6aa651';ng.beginPath();ng.ellipse(x+w/2,LH,w/2,h,0,Math.PI,0);ng.fill();x+=w*(0.6+r()*0.5)}
