function poly(x1,y1,x2,y2,x3,y3,x4,y4,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill()}
function project(p,cx,cy,cz){p.camera.x=-cx;p.camera.y=p.world.y-cy;p.camera.z=p.world.z-cz;const s=p.screen.scale=camDepth/p.camera.z;p.screen.x=Math.round(W/2+s*p.camera.x*W/2);p.screen.y=Math.round(H/2-s*p.camera.y*H/2);p.screen.w=Math.round(s*ROADW*W/2)}
function drawBg(pY){
