try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.owned){save=Object.assign(save,s);for(const id in save.owned){if(!CAR[id]){delete save.owned[id];continue}const d=newCar(id),o=save.owned[id];save.owned[id]=Object.assign(d,o,{lv:Object.assign(d.lv,o.lv),slots:Object.assign(d.slots,o.slots)})}}}catch(e){}
