<title>OVERDRIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:ital,wght@0,600;0,800;1,800&display=swap">
<style>
/* Layout: full-screen canvas road as the backdrop; hub (tabs: world tour, garage, showroom, parts) layered over it; HUD during races. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0a0e15; --panel:#111824; --panel2:#182233; --line:#25324a;
  --fg:#e9eef6; --muted:#8a97ab;
  --nitro:#3fd7ff; --signal:#ff7a1a; --good:#5be38a; --warn:#ffcf3f; --bad:#ff4d5e;
  --r0:#a9b6c6; --r1:#3fd7ff; --r2:#ffb000;
  --disp:'Saira Condensed','IBM Plex Sans KR','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans KR',system-ui,sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}

.screen{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(180deg,rgba(10,14,21,.72),rgba(10,14,21,.95) 46%);-webkit-user-select:text;user-select:text}
.wrap{max-width:1120px;margin:0 auto;padding-block:18px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.logo{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(40px,7.4vw,70px);line-height:.82;letter-spacing:.01em}
.logo em{color:var(--signal);font-style:italic}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.1em}
.wallet{display:flex;gap:8px;flex-wrap:wrap}
.money{display:flex;align-items:baseline;gap:7px;padding:7px 13px;background:var(--panel);border:1px solid var(--line)}
.money small{color:var(--muted);font-size:12px}
.money b{font-family:var(--disp);font-size:28px;font-variant-numeric:tabular-nums}
.money.cr b{color:var(--warn)}
h2{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(26px,4vw,34px);margin:0;text-wrap:balance;letter-spacing:.02em;line-height:1}
h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
p{margin:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px 12px;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--signal)}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{background:var(--panel);border:1px solid var(--line);padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.sub button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel{display:flex;flex-direction:column;gap:16px}

.btn{font-family:var(--disp);font-weight:800;font-style:italic;font-size:19px;letter-spacing:.04em;border:0;padding:11px 24px;cursor:pointer;color:var(--fg);background:var(--panel2);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);white-space:nowrap}
.btn.primary{background:var(--signal);color:#1b0c00}
.btn.buy{background:var(--nitro);color:#02161d;font-size:16px;padding:8px 18px}
.btn.sm{font-size:15px;padding:7px 16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.12)}
:focus-visible{outline:2px solid var(--nitro);outline-offset:3px}
.cta{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
.keys{color:var(--muted);font-size:13px;line-height:1.7}
.keys kbd{font-family:var(--disp);font-size:13px;padding:1px 6px;border:1px solid var(--line);background:var(--panel2)}

/* bottom tabs */
.btabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(10,14,21,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.btab{background:none;border:0;padding:9px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:600;border-top:3px solid transparent;margin-top:-1px;min-width:0}
.btab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btab[aria-selected="true"]{color:var(--fg);border-top-color:var(--signal)}
.btab[aria-selected="true"] svg{stroke:var(--signal)}
.btab.race svg{width:28px;height:28px}
#sHub{display:flex;flex-direction:column}
#sHub .wrap{flex:1;width:100%;max-width:1120px}
/* settings */
.setlist{background:var(--panel);border:1px solid var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-child{border-top:0}
.setrow b{display:block;font-size:15px}
.setrow small{color:var(--muted);font-size:13px}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.ctrl kbd{font-family:var(--disp);font-size:14px;padding:1px 7px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.danger{border:1px solid rgba(255,77,94,.45);background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.btn.red{background:var(--bad);color:#200307}
/* world */
.mapbox{background:var(--panel);border:1px solid var(--line);padding:10px;overflow:hidden}
#worldMap{width:100%;height:auto;display:block}
.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.ctry{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.ctry.open{border-color:var(--nitro);cursor:pointer}
.ctry.open:hover{background:var(--panel2)}
.ctry.locked{opacity:.55}
.ctry .t{font-weight:700;font-size:18px}
.ctry .tier{font-family:var(--disp);font-weight:800;font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--muted)}
.ctry.open .tier{color:var(--nitro)}
.ctry .s{color:var(--muted);font-size:13px}

/* league */
.lhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.prog .bar{height:8px;background:var(--line);position:relative}
.prog .bar i{position:absolute;inset:0 auto 0 0;background:var(--warn)}
.prog .bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5}
.prog small{color:var(--muted);font-size:12px}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.cities{grid-template-columns:minmax(0,1fr)}}
.city{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.city .hd{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.city .hd b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:1}
.city .hd small{color:var(--muted);font-size:12px}
.city.locked .hd b{color:var(--muted)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.ev:hover:not(:disabled){background:var(--panel2)}
.ev:disabled{cursor:not-allowed;opacity:.45}
.ev .ix{font-family:var(--disp);font-size:22px;color:var(--muted);grid-row:1 / span 2}
.ev .n{font-weight:700;font-size:15px}
.ev .m{color:var(--muted);font-size:12px}
.ev .st{grid-row:1 / span 2;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stars{color:var(--warn);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.final{background:linear-gradient(100deg,#2a1206,var(--panel) 60%);border:1px solid var(--signal);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.final.locked{border-color:var(--line);background:var(--panel);opacity:.6}
.final b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:1}

/* garage */
.garage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:860px){.garage{grid-template-columns:minmax(0,1fr)}}
.bay{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bay canvas{width:100%;height:auto;display:block;background:#070a10}
.carname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.carname b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:1}
.cls{font-family:var(--disp);font-weight:800;font-size:15px;padding:2px 8px;color:#0a0e15;background:var(--fg)}
.cls.D{background:#a9b6c6}.cls.C{background:#5be38a}.cls.B{background:#3fd7ff}.cls.A{background:#c78cff}.cls.S{background:#ffb000}
.pr{margin-left:auto;font-family:var(--disp);font-size:15px;color:var(--muted)}
.pr b{font-size:28px;color:var(--fg);font-style:italic}
.spec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px 12px;align-items:center;margin:0}
.spec dt{color:var(--muted);font-size:13px}
.spec dd{margin:0}
.spec .val{font-family:var(--disp);font-size:19px;font-variant-numeric:tabular-nums;text-align:right;min-width:76px}
.meter{height:6px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--nitro)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--nitro);color:var(--nitro)}
.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.urow .nm{font-weight:700;font-size:15px}
.urow .nm span{font-family:var(--disp);color:var(--muted);font-size:14px;margin-left:4px}
.urow .ds{color:var(--muted);font-size:13px;grid-column:1}
.pips{display:flex;gap:5px;grid-column:1;align-items:center}
.pips i{width:22px;height:7px;background:var(--line);transform:skewX(-24deg);position:relative}
.pips i.on{background:var(--nitro)}
.pips i.slot::after{content:"";position:absolute;left:50%;top:-6px;width:4px;height:4px;background:var(--warn);transform:translateX(-50%) skewX(24deg) rotate(45deg)}
.urow .btn{grid-column:2;grid-row:1 / span 3}
.srow{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.srow .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.srow .hd b{font-size:15px}
.srow .hd small{color:var(--muted);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{background:var(--panel2);border:1px dashed var(--line);padding:8px;min-height:52px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.slot b{font-size:13px;overflow-wrap:anywhere}
.slot.fill{border-style:solid}
.slot.r0{border-color:var(--r0)}.slot.r1{border-color:var(--r1)}.slot.r2{border-color:var(--r2)}
.slot.lock{cursor:not-allowed;opacity:.45;color:var(--muted)}
.slot.pick{outline:2px solid var(--fg);outline-offset:1px}
.slot small{color:var(--muted)}
.picker{background:var(--bg);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.picker .it{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.rar{font-weight:700;font-size:11px;letter-spacing:.06em}
.rar.r0{color:var(--r0)}.rar.r1{color:var(--r1)}.rar.r2{color:var(--r2)}
.cos{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border:2px solid transparent;cursor:pointer;transform:skewX(-12deg);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);outline:2px solid var(--bg);outline-offset:-4px}
.plate-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.plate-row input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:8px 10px;font:inherit;font-size:15px;width:150px}
.plate{background:#eef1f4;color:#111;font-weight:700;font-size:20px;padding:4px 16px;border:2px solid #2a2d33;letter-spacing:.06em;min-width:130px;text-align:center}

/* showroom / shop */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.car{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.car.cur{border-color:var(--nitro)}
.car.locked{opacity:.42}
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.brand-t{background:var(--panel);border:1px solid var(--line);padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.brand-t:hover{border-color:var(--nitro)}
.brand-t canvas{width:100%;height:auto;display:block;background:#070a10}
.brand-t .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.brand-t .bn{font-family:var(--disp);font-style:italic;font-weight:800;font-size:44px;line-height:.9}
.brand-t .bs{color:var(--muted);font-size:13px}
.brand-t .bm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:13px}
.brand-t.lockb{opacity:.55}
.brand-t.lockb canvas{filter:grayscale(.85) brightness(.7)}
.showhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.car.locked canvas{filter:grayscale(.85) brightness(.7)}
.lock{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--muted)}
.lock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.car canvas{width:100%;height:auto;display:block;background:#070a10}
.car .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.car .nm{display:flex;align-items:center;gap:8px}
.car .nm b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.car .nm .pr{white-space:nowrap;flex-shrink:0}
.car .ds{color:var(--muted);font-size:13px;flex:1}
.car .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--muted)}
.car .kv b{display:block;font-family:var(--disp);font-size:18px;color:var(--fg)}
.car .ft{display:flex;justify-content:space-between;align-items:center;gap:8px}
.car .price{font-family:var(--disp);font-size:22px;color:var(--warn)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pgrp{background:var(--panel);border:1px solid var(--line);padding:4px 14px 8px}
.pgrp h4{margin:10px 0 2px;font-size:16px}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.pitem:first-of-type{border-top:0}
.pitem .n{font-weight:700;font-size:14px}
.pitem .e{color:var(--muted);font-size:12px}
.pitem .btn{grid-row:1 / span 2;grid-column:2}
.note{background:var(--panel);border-left:3px solid var(--warn);padding:11px 14px;font-size:14px;line-height:1.6;max-width:72ch;color:var(--fg)}

/* prep / result */
.prepgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.prepgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.prepgrid div{background:var(--panel);padding:11px 14px;display:flex;flex-direction:column;gap:3px}
.prepgrid small{color:var(--muted);font-size:12px}
.prepgrid b{font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums}
.good{color:var(--good)}.warnc{color:var(--warn)}.badc{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0}
.card[aria-pressed="true"]{border-color:var(--nitro);box-shadow:inset 0 0 0 1px var(--nitro);background:var(--panel2)}
.card .t{font-weight:700;font-size:16px}
.card .s{color:var(--muted);font-size:13px}
.card .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.card .row b{color:var(--fg);font-family:var(--disp);font-size:16px}
.tdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid currentColor;vertical-align:-2px;margin-right:6px}
.sec{display:flex;flex-direction:column;gap:9px}
.place{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(80px,17vw,150px);line-height:.85}
.place small{font-size:.32em;color:var(--muted);margin-left:6px}
.stand{width:100%;border-collapse:collapse;font-size:14px}
.stand td{padding:8px 10px;border-top:1px solid var(--line)}
.stand td.p{font-family:var(--disp);font-size:20px;font-style:italic;width:40px}
.stand td.t{font-family:var(--disp);font-size:17px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stand td.c{color:var(--muted);font-size:12px}
.stand tr.me td{background:rgba(255,122,26,.14)}
.stand tr.me td.p{color:var(--signal)}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
.drop{border:1px solid var(--r1);background:var(--panel);padding:12px 14px;display:flex;gap:12px;align-items:center}
.resgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media (max-width:760px){.resgrid{grid-template-columns:minmax(0,1fr)}}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--disp)}
.hud-tl{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hpos{font-weight:800;font-style:italic;line-height:.85}
.hpos b{font-size:64px}.hpos span{font-size:24px;color:rgba(233,238,246,.7)}
.hlap,.htime{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.htime{color:rgba(233,238,246,.75)}
.hud-br{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hspd{font-weight:800;font-style:italic;line-height:.85;font-variant-numeric:tabular-nums}
.hspd b{font-size:72px}.hspd span{font-size:20px;margin-left:4px;color:rgba(233,238,246,.7)}
.hbar{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;font-weight:600}
.hbar div{width:180px;height:10px;background:rgba(0,0,0,.45);transform:skewX(-20deg);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.hbar i{display:block;height:100%;width:50%;background:var(--nitro)}
.hbar.full i{box-shadow:0 0 12px var(--nitro);background:#9cecff}
.hbtns{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;pointer-events:auto}
.hbtns button{font-family:var(--body);font-weight:700;font-size:13px;color:var(--fg);background:rgba(10,14,20,.6);border:1px solid rgba(255,255,255,.2);padding:7px 12px;cursor:pointer}
.pop{position:absolute;left:0;right:0;top:22%;text-align:center;font-weight:800;font-style:italic;font-size:clamp(26px,5vw,44px);opacity:0;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.pop.show{animation:pop 1.1s ease-out forwards}
.pop.nitro{color:var(--nitro)}.pop.bad{color:var(--bad)}.pop.go{color:var(--warn);font-size:clamp(44px,10vw,90px)}.pop.warn{color:var(--warn)}
@keyframes pop{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-style:italic;font-size:clamp(90px,22vw,200px);text-shadow:0 6px 30px rgba(0,0,0,.7)}
.banner{position:absolute;left:0;right:0;top:16%;text-align:center;display:flex;flex-direction:column;gap:4px;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.banner small{font-family:var(--body);font-size:14px;letter-spacing:.2em;color:var(--warn)}
.banner b{font-weight:800;font-style:italic;font-size:clamp(30px,6vw,56px);line-height:1}
.touch{display:none}
@media (pointer:coarse){
  .touch{display:flex;position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding-inline:12px;pointer-events:none}
  .touch .grp{display:flex;gap:10px;pointer-events:auto}
  .touch button{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(10,14,20,.45);color:var(--fg);font-family:var(--body);font-weight:700;font-size:14px;touch-action:none}
  .touch button.on{background:rgba(63,215,255,.35)}
  .touch .n{border-color:var(--nitro);color:var(--nitro)}
  .hud-br{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .hspd b{font-size:52px}.hbar div{width:120px}
}
@media (max-width:520px){.hpos b{font-size:48px}}
@media (prefers-reduced-motion:reduce){.pop.show{animation-duration:1.4s}}
