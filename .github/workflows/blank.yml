  ctx.fillStyle='#0f1218';ctx.fillRect(x-w,y-h,2*w,bh);
  const cs=bh/2,n=Math.ceil(2*w/cs);for(let i=0;i<n;i++)for(let j=0;j<2;j++)if((i+j)%2){ctx.fillStyle='#f2f2f2';ctx.fillRect(x-w+i*cs,y-h+j*cs,Math.min(cs,x+w-(x-w+i*cs)),cs)}
  if(w>60){ctx.fillStyle='#0f1218';ctx.fillRect(x-w*0.32,y-h,w*0.64,bh);txt('OVERDRIVE',x,y-h+bh*0.52,bh*0.78,'#ff7a1a',w*0.58)}
