const SEG=200,RUMBLE=3,ROADW=2000,LANES=3,CAMH=1000,CARW=560,FOG=5;let DRAW=save.settings.quality==='high'?240:160;
const BASEDEPTH=1/Math.tan(50*Math.PI/180),playerZ=CAMH*BASEDEPTH;
