    const hx=LW*0.3;fg.fillStyle='#160f30';fg.beginPath();fg.ellipse(hx,LH,LW*0.09,LH*0.55,0,Math.PI,0);fg.fill();
    fg.fillStyle='#d8e4ff';fg.fillRect(hx-1.5*DPR,LH*0.13,3*DPR,LH*0.34);fg.fillRect(hx-6*DPR,LH*0.2,12*DPR,5*DPR);fg.fillRect(hx-0.75*DPR,LH*0.02,1.5*DPR,LH*0.12);
