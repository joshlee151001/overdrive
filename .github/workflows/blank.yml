const THEMES={
  seoul:{sky:['#04050d','#141032','#2c1a55'],fog:'#1d1538',grass:['#10131f','#0d1019'],water:['#0b1430','#0a1229'],rumble:['#ff3fa4','#1a1e2d'],road:['#2b2e3a','#272a35'],lane:'#c8d0ff',glow:'#9fe9ff',chev:'#ff3fa4',lamps:true,night:true,every:6,sprites:['tower','tower','apt','apt','sign'],signs:['OVERDRIVE','서울','한강','24시','노래방','PC방']},
  busan:{sky:['#0e1640','#4a2f6e','#ff8f5a'],fog:'#6a4466',grass:['#20232a','#1c1f25'],water:['#1d2f63','#1a2a59'],rumble:['#ffffff','#2a62d6'],road:['#34343e','#2f2f39'],lane:'#fff1d6',glow:'#ffd08a',chev:'#ffb000',lamps:true,pylon:true,night:true,every:6,sprites:['apt','apt','tower','palm','sign'],signs:['부산','해운대','광안리','회센터','OVERDRIVE']},
  jeju:{sky:['#2f7fd0','#7fbcea','#d6edf8'],fog:'#cfe5ef',grass:['#8fb843','#84ad3d'],water:['#1f9cc4','#1b93b9'],rumble:['#eeeeee','#d23b3b'],road:['#5a5f68','#555a63'],lane:'#ffffff',glow:'#ffffff',chev:'#ff7a1a',lamps:false,night:false,every:3,sprites:['canola','canola','palm','dolwall','orange','harubang','palm','canola'],signs:[]}
};
const OFF={tower:[2.6,4.6],apt:[2.2,3.4],sign:[1.5,2.1],palm:[1.35,2.4],dolwall:[1.3,1.7],orange:[1.6,3],canola:[1.4,3.4],harubang:[1.3,1.6]};
let track=EVENTS.s1,theme=THEMES.seoul,segs=[],trackLen=0,layers=null;
const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
function addSeg(curve,y){const n=segs.length;segs.push({index:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y,z:(n+1)*SEG},camera:{},screen:{}},curve,sprites:[],cars:[],dark:Math.floor(n/RUMBLE)%2,clip:0,looped:false,fog:1,water:false})}
const easeIn=(a,b,p)=>a+(b-a)*p*p,easeInOut=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);
function road(enter,hold,leave,curve,height){
  const sy=lastY(),ey=sy+height*SEG,tot=enter+hold+leave,start=segs.length;
  for(let n=0;n<enter;n++)addSeg(easeIn(0,curve,n/enter),easeInOut(sy,ey,n/tot));
  for(let n=0;n<hold;n++)addSeg(curve,easeInOut(sy,ey,(enter+n)/tot));
  for(let n=0;n<leave;n++)addSeg(easeInOut(curve,0,n/leave),easeInOut(sy,ey,(enter+hold+n)/tot));
  if(Math.abs(curve)>=4)for(let i=start+Math.max(0,enter-15);i<start+enter+hold;i+=5)segs[i].sprites.push({type:'chev',offset:curve>0?-1.24:1.24,dir:Math.sign(curve)});
}
function genRecipe(seed,g){
  const r=rng(seed),out=[[20,80,20,0,0]];let tot=120;
  while(tot<g.len){
    let curve=0;if(r()>=g.straight){const sharp=r()<g.sharp;curve=(sharp?4.2+r()*1.8:1.5+r()*2.4)*(r()<0.5?-1:1)}
    const enter=20+Math.floor(r()*25),hold=curve===0?40+Math.floor(r()*90):(Math.abs(curve)>=4?20+Math.floor(r()*25):35+Math.floor(r()*50));
    out.push([enter,hold,enter,+curve.toFixed(1),Math.round((r()*2-1)*g.hill)]);tot+=enter*2+hold;
    if(curve!==0&&r()<0.3){const c2=-curve*(0.7+r()*0.4),e2=20+Math.floor(r()*15),h2=25+Math.floor(r()*30);out.push([e2,h2,e2,+c2.toFixed(1),0]);tot+=e2*2+h2}
  }
