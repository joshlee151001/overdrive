function txt(t,x,y,size,col,maxW){ctx.font=`italic 800 ${Math.round(size)}px 'Saira Condensed','IBM Plex Sans KR',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(t,x,y,maxW)}
