}
const segCount=e=>genRecipe(e.seed,e.gen).reduce((s,r)=>s+r[0]+r[1]+r[2],0)+180;
const trackKm=e=>segCount(e)*SEG*(KMH/3.6/B)/1000;
function buildTrack(ev){
  track=ev;theme=THEMES[ev.city.theme];segs=[];
  for(const r of genRecipe(ev.seed,ev.gen))road(...r);
  road(40,40,40,0,-lastY()/SEG);road(10,40,10,0,0);
  const n=segs.length;trackLen=n*SEG;
  for(const [a,b] of ev.water)for(let i=Math.floor(a*n);i<Math.floor(b*n);i++)segs[i].water=true;
  const r=rng(ev.seed+7),th=theme;
  for(let i=12;i<n-6;i++){
    const s=segs[i];
    if(s.water){
      if(i%3===0)s.sprites.push({type:'rail',offset:-1.13},{type:'rail',offset:1.13});
      if(th.lamps&&i%9===0)s.sprites.push({type:'lamp',offset:-1.18},{type:'lamp',offset:1.18});
      if(th.pylon&&i%80===0)s.sprites.push({type:'pylon',offset:-1.6},{type:'pylon',offset:1.6});
      continue;
    }
    if(th.lamps&&i%10===0)s.sprites.push({type:'lamp',offset:-1.18},{type:'lamp',offset:1.18});
    if(i%th.every===0){const side=r()<0.5?-1:1,type=th.sprites[Math.floor(r()*th.sprites.length)],o=OFF[type];
      s.sprites.push({type,offset:side*(o[0]+r()*(o[1]-o[0])),v:r(),text:th.signs.length?th.signs[Math.floor(r()*th.signs.length)]:''})}
