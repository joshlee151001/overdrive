  const r1=a.w/5,r2=b.w/5;
  poly(a.x-a.w-r1,a.y,a.x-a.w,a.y,b.x-b.w,b.y,b.x-b.w-r2,b.y,s.water?'#9aa3b2':th.rumble[d]);
  poly(a.x+a.w+r1,a.y,a.x+a.w,a.y,b.x+b.w,b.y,b.x+b.w+r2,b.y,s.water?'#9aa3b2':th.rumble[d]);
