/* ================= RACE STATE ================= */
let cars=[],state='menu',position=0,pDist=0,playerX=0,speed=0,nitro=0,tireWear=1,tire=save.tire||'medium';
let raceTime=0,lapStart=0,lapTimes=[],lastLap=1,countT=0,finishT=0,finishOrder=[],place=0,shake=0,skyOff=0,drifting=false,nitroOn=false,offroad=false,steerVis=0,particles=[],warnedTire=false,clock=0,pausedFrom=null,lastCountShown='',PST=null,LOOK=null,standings=[];
const keys={left:0,right:0,brake:0,nitro:0};
function initCars(attractMode){
  for(const s of segs)s.cars.length=0;cars=[];
  const r=rng(track.seed*3+(attractMode?5:1)),lo=track.final?0.84:0.8,hi=track.final?0.99:0.96;
  const names=[...RIVALS].sort(()=>r()-0.5);
  for(let i=0;i<7;i++){
    const z=playerZ+SEG*(5+i*3.2),lane=i%2?0.42:-0.42,cc=CARS[Math.floor(r()*CARS.length)];
    const look={body:cc.body,color:PAINTS[Math.floor(r()*PAINTS.length)],finish:FINISHES[Math.floor(r()*4)].k,sticker:r()<0.35?STICKERS[1+Math.floor(r()*4)].k:'none',stickColor:STCOL[Math.floor(r()*STCOL.length)],plate:''};
    const c={z,dist:z,offset:lane,lane,base:U(track.pace)*(lo+(hi-lo)*(i/6)*(0.85+r()*0.3)),speed:0,look,name:names[i],car:cc.name,wasAhead:true,finished:false,ftime:0,laneT:3+r()*6,seg:null};
    if(attractMode){c.z=r()*trackLen;c.dist=c.z;c.speed=c.base*0.8}
    c.seg=findSeg(c.z);c.seg.cars.push(c);cars.push(c);
  }
}

/* ---------- audio */
let audio=null,muted=!save.settings.sound;
function initAudio(){if(audio)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o1=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=500;g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(ac.destination);o1.start();o2.start();audio={ac,o1,o2,f,g}}catch(e){audio=null}}
function updAudio(){if(!audio)return;const t=audio.ac.currentTime,on=(state==='race'||state==='count'||state==='finish')&&!muted;const s=clamp(speed/B,0,1.6),gp=s*5,gear=Math.min(4,Math.floor(gp)),rpm=gp-gear;const f=state==='count'?48+Math.random()*4:52+rpm*95+gear*12;
  audio.o1.frequency.setTargetAtTime(f,t,0.05);audio.o2.frequency.setTargetAtTime(f*0.5,t,0.05);audio.f.frequency.setTargetAtTime(400+s*1300+(nitroOn?1500:0),t,0.08);audio.g.gain.setTargetAtTime(on?0.045:0,t,0.1)}

/* ---------- update */
const finishLine=()=>track.laps*trackLen+playerZ;
function update(dt){
  const st=PST||carStats(save.cur),auto=state==='menu'||state==='finish'||state==='result';
  clock+=dt;
  if(state==='count'){countT-=dt;const nn=Math.ceil(countT-0.5),t=countT>0.5?(countT>3.5?'':String(nn)):'';if(t!==lastCountShown){$('#count').textContent=t;lastCountShown=t}if(countT<=0.5){state='race';$('#banner').textContent='';pop('GO!','go')}}
  const pz=position+playerZ,pSeg=findSeg(pz),sp=speed/B;
  if(state==='race')raceTime+=dt;
  if(state!=='count'){
    if(auto){
      const ahead=findSeg(pz+SEG*6),tgt=clamp(-ahead.curve*0.06,-0.5,0.5);playerX+=(tgt-playerX)*Math.min(1,dt*2);
      const v=st.max*(state==='menu'?0.78:0.62);speed+=(v-speed)*Math.min(1,dt*0.8);
      drifting=false;nitroOn=false;offroad=false;steerVis+=(clamp(-pSeg.curve*0.15,-1,1)-steerVis)*Math.min(1,dt*4);
    }else{
      const steer=(keys.right?1:0)-(keys.left?1:0);
      drifting=!!keys.brake&&steer!==0&&sp>0.35;nitroOn=!!keys.nitro&&nitro>0.01;
      const gripNow=st.grip*TIRES[tire].grip*track.grip*(0.6+0.4*tireWear);
      const dx=dt*2*Math.min(sp,1.2);
      playerX+=dx*steer*(drifting?1.75:0.95+0.12*(gripNow-1));
      playerX-=dx*Math.min(sp,1.4)*pSeg.curve*(0.25/gripNow)*(drifting?0.7:1)*lerp(1,st.aero,clamp(sp,0,1));
      steerVis+=(steer*(drifting?1.7:1)-steerVis)*Math.min(1,dt*8);
      const vmax=st.max*(nitroOn?st.nitroPow:1);
      if(keys.brake&&!drifting)speed-=st.max*1.2*st.brake*dt;
      else if(drifting)speed-=st.max*0.09*st.drift*dt;
      else if(speed<vmax)speed=Math.min(vmax,speed+st.accel*(nitroOn?1.9:1)*dt);
      else speed=Math.max(vmax,speed-st.max*0.3*dt);
      if(pSeg.water&&Math.abs(playerX)>1.04){const side=Math.sign(playerX);playerX=side*1.04;if(speed>B*0.3){speed*=1-1.6*dt;if(Math.random()<0.4)sparks(side)}offroad=false}
      else offroad=Math.abs(playerX)>1.05;
      if(offroad&&speed>st.max*0.38)speed-=st.max*0.95*dt;
      playerX=clamp(playerX,-2.3,2.3);speed=Math.max(0,speed);
      if(nitroOn)nitro-=st.drain*dt;
      nitro=clamp(nitro+dt*(0.012+(drifting?0.17:0)),0,1);
      tireWear=Math.max(0,tireWear-dt*TIRES[tire].wear*(0.0034+Math.abs(steer)*Math.min(sp,1)*0.004+(drifting?0.011:0)));
      if(tireWear<0.25&&!warnedTire){warnedTire=true;pop('타이어가 다 닳아 가!','warn')}
    }
    position+=speed*dt;pDist+=speed*dt;while(position>=trackLen)position-=trackLen;
  }
  const tf=(nitroOn?114:100)+Math.min(sp,1.3)*4;fov+=(tf-fov)*Math.min(1,dt*3);camDepth=1/Math.tan(fov/2*Math.PI/180);
  skyOff+=dt*pSeg.curve*sp*0.004;
  if(state!=='count'){
    for(const c of cars){
      let tgt=c.base;const ah=findSeg(c.z+SEG*8);tgt*=1-Math.min(0.22,Math.abs(ah.curve)*0.035);
      if(state!=='menu'){const gap=c.dist-pDist;if(gap>trackLen*0.12)tgt*=0.93;else if(gap<-trackLen*0.08)tgt*=1.06}
      c.speed+=(tgt-c.speed)*Math.min(1,dt*0.7);
      c.laneT-=dt;if(c.laneT<0){c.laneT=4+Math.random()*6;c.lane=[-0.55,0,0.55][Math.floor(Math.random()*3)]}
      let to=c.lane;
      const check=(d,x,v)=>{if(d>0&&d<SEG*8&&Math.abs(x-c.offset)<0.36&&c.speed>v){to=x>0?x-0.62:x+0.62;if(d<SEG*1.4)c.speed=Math.min(c.speed,v)}};
      for(const o of cars)if(o!==c)check(o.dist-c.dist,o.offset,o.speed);
      if(state==='race')check(pDist-c.dist,playerX,speed);
      c.offset=clamp(c.offset+clamp(to-c.offset,-1,1)*dt*1.3,-0.85,0.85);
      c.z+=c.speed*dt;c.dist+=c.speed*dt;while(c.z>=trackLen)c.z-=trackLen;
      const ns=findSeg(c.z);if(ns!==c.seg){const i=c.seg.cars.indexOf(c);if(i>=0)c.seg.cars.splice(i,1);ns.cars.push(c);c.seg=ns}
      if(state==='race'&&!c.finished&&c.dist>=finishLine()){c.finished=true;c.ftime=raceTime;finishOrder.push(c)}
    }
  }
  if(state==='race'){
    for(const c of cars){
      const d=c.dist-pDist,ox=Math.abs(c.offset-playerX);
      if(ox<0.25){
        if(d>0&&d<SEG*0.9&&speed>c.speed){speed=c.speed*0.8;shake=0.5;sparks(0);pop('쿵!','bad');c.speed*=1.05}
        else if(d<0&&d>-SEG*0.9&&c.speed>speed)c.speed=speed*0.9;
      }
      const ahead=d>0;
      if(c.wasAhead&&!ahead){if(ox<0.55&&sp>0.55){nitro=Math.min(1,nitro+0.12);pop('아슬아슬! +니트로','nitro')}else nitro=Math.min(1,nitro+0.04)}
      c.wasAhead=ahead;
    }
    const lapNow=Math.floor((pDist-playerZ)/trackLen)+1;
    if(lapNow>lastLap&&lapNow<=track.laps){lapTimes.push(raceTime-lapStart);lapStart=raceTime;lastLap=lapNow;pop(lapNow===track.laps?'마지막 랩!':'LAP '+lapNow,'warn')}
    if(pDist>=finishLine())finishRace();
  }
  if(state==='finish'){finishT+=dt;if(finishT>2.4)showResult()}
  const pw=camDepth/playerZ*CARW*W/2;
  if(drifting||(offroad&&speed>B*0.2)){for(let i=0;i<2;i++)for(const s of[-1,1])particles.push({x:W/2+s*pw*0.38+(Math.random()-0.5)*pw*0.1,y:H*0.97,vx:s*(20+Math.random()*60)*DPR-steerVis*40*DPR,vy:-(10+Math.random()*30)*DPR,r:pw*0.06,g:pw*0.18,life:0,max:0.6+Math.random()*0.4,c:offroad?theme.grass[0]:'#d8dde6'})}
  for(const p of particles){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.g*dt}
  particles=particles.filter(p=>p.life<p.max);if(particles.length>300)particles.splice(0,particles.length-300);
  shake=Math.max(0,shake-dt);
  updHud();updAudio();
}
function sparks(side){const pw=camDepth/playerZ*CARW*W/2;for(let i=0;i<(side?6:24);i++)particles.push({x:W/2+(side?side*pw*0.5:(Math.random()-0.5)*pw*0.6),y:H*0.9-pw*0.2,vx:(side?side*200:(Math.random()-0.5)*600)*DPR*Math.random(),vy:-(100+Math.random()*300)*DPR,r:2*DPR,g:0,life:0,max:0.4,c:'#ffd27a',spark:true})}

