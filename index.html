<title>OVERDRIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Saira+Condensed:ital,wght@0,600;0,800;1,800&display=swap">
<style>
/* Layout: full-screen canvas road as the backdrop; hub (tabs: world tour, garage, showroom, parts) layered over it; HUD during races. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0a0e15; --panel:#111824; --panel2:#182233; --line:#25324a;
  --fg:#e9eef6; --muted:#8a97ab;
  --nitro:#3fd7ff; --signal:#ff7a1a; --good:#5be38a; --warn:#ffcf3f; --bad:#ff4d5e;
  --r0:#a9b6c6; --r1:#3fd7ff; --r2:#ffb000;
  --disp:'Saira Condensed','IBM Plex Sans KR','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans KR',system-ui,sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}

.screen{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(180deg,rgba(10,14,21,.72),rgba(10,14,21,.95) 46%);-webkit-user-select:text;user-select:text}
.wrap{max-width:1120px;margin:0 auto;padding-block:18px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.logo{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(40px,7.4vw,70px);line-height:.82;letter-spacing:.01em}
.logo em{color:var(--signal);font-style:italic}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.1em}
.wallet{display:flex;gap:8px;flex-wrap:wrap}
.money{display:flex;align-items:baseline;gap:7px;padding:7px 13px;background:var(--panel);border:1px solid var(--line)}
.money small{color:var(--muted);font-size:12px}
.money b{font-family:var(--disp);font-size:28px;font-variant-numeric:tabular-nums}
.money.cr b{color:var(--warn)}
h2{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(26px,4vw,34px);margin:0;text-wrap:balance;letter-spacing:.02em;line-height:1}
h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
p{margin:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px 12px;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--signal)}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{background:var(--panel);border:1px solid var(--line);padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.sub button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel{display:flex;flex-direction:column;gap:16px}

.btn{font-family:var(--disp);font-weight:800;font-style:italic;font-size:19px;letter-spacing:.04em;border:0;padding:11px 24px;cursor:pointer;color:var(--fg);background:var(--panel2);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);white-space:nowrap}
.btn.primary{background:var(--signal);color:#1b0c00}
.btn.buy{background:var(--nitro);color:#02161d;font-size:16px;padding:8px 18px}
.btn.sm{font-size:15px;padding:7px 16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.12)}
:focus-visible{outline:2px solid var(--nitro);outline-offset:3px}
.cta{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
.keys{color:var(--muted);font-size:13px;line-height:1.7}
.keys kbd{font-family:var(--disp);font-size:13px;padding:1px 6px;border:1px solid var(--line);background:var(--panel2)}

/* bottom tabs */
.btabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(10,14,21,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.btab{background:none;border:0;padding:9px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:600;border-top:3px solid transparent;margin-top:-1px;min-width:0}
.btab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btab[aria-selected="true"]{color:var(--fg);border-top-color:var(--signal)}
.btab[aria-selected="true"] svg{stroke:var(--signal)}
.btab.race svg{width:28px;height:28px}
#sHub{display:flex;flex-direction:column}
#sHub .wrap{flex:1;width:100%;max-width:1120px}
/* settings */
.setlist{background:var(--panel);border:1px solid var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-child{border-top:0}
.setrow b{display:block;font-size:15px}
.setrow small{color:var(--muted);font-size:13px}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.ctrl kbd{font-family:var(--disp);font-size:14px;padding:1px 7px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.danger{border:1px solid rgba(255,77,94,.45);background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.btn.red{background:var(--bad);color:#200307}
/* profile & login */
.homebtns{display:flex;flex-direction:column;gap:12px}
.bigbtn{background:var(--panel);border:1px solid var(--line);padding:18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden}
.bigbtn:hover{border-color:var(--nitro)}
.bigbtn.new:hover{border-color:var(--signal)}
.bigbtn::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:140px;background:linear-gradient(90deg,transparent,rgba(63,215,255,.1));transform:skewX(-14deg);pointer-events:none}
.bigbtn.new::after{background:linear-gradient(90deg,transparent,rgba(255,122,26,.12))}
.bigbtn .bk{font-family:var(--disp);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.16em;color:var(--nitro)}
.bigbtn.new .bk{color:var(--signal)}
.bigbtn b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(26px,4.5vw,34px);line-height:1}
.bigbtn span:last-child{color:var(--muted);font-size:14px}
.pchip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:5px 13px 5px 6px;cursor:pointer;text-align:left}
.pchip:hover{border-color:var(--nitro)}
.pchip b{display:block;font-size:14px;line-height:1.2;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip small{color:var(--muted);font-size:12px}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;font-size:20px;flex-shrink:0;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--avc,var(--line))}
.av.big{width:84px;height:84px;font-size:44px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.login{max-width:560px;padding-top:8vh}
.ulist{display:flex;flex-direction:column;gap:8px}
.ucard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ucard:hover{border-color:var(--nitro)}
.ucard b{font-size:17px;display:block}
.ucard small{color:var(--muted);font-size:12px}
.fbox{background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:11px 12px;font:inherit;font-size:16px;width:100%}
.field input:focus{border-color:var(--nitro);outline:none}
.avpick{display:flex;gap:8px;flex-wrap:wrap}
.avpick button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);font-size:22px;cursor:pointer;padding:0}
.avpick button[aria-pressed="true"]{border-color:var(--signal);background:var(--bg)}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.okmsg{color:var(--good);font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.profhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:18px}
.profhead .nm{font-family:var(--disp);font-style:italic;font-weight:800;font-size:40px;line-height:1}
.xpbar{height:10px;background:var(--line);transform:skewX(-20deg);overflow:hidden;width:min(320px,70vw)}
.xpbar i{display:block;height:100%;background:var(--signal)}
.statgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.statgrid div{min-width:0;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.statgrid small{color:var(--muted);font-size:12px}
.statgrid b{font-family:var(--disp);font-size:26px;font-variant-numeric:tabular-nums}
@media (max-width:700px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.xpline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:10px 14px;font-size:14px}
.xpline b{color:var(--signal)}
.guestbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,207,63,.08);border:1px solid rgba(255,207,63,.45);padding:10px 14px;font-size:14px}
.guestbar b{color:var(--warn)}
.guestlink{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-top:1px solid var(--line);padding-top:16px}
/* race modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:230px;min-width:0}
.mode::after{content:"";position:absolute;right:-50px;top:0;bottom:0;width:160px;background:linear-gradient(90deg,transparent,rgba(255,122,26,.14));transform:skewX(-14deg);pointer-events:none}
.mode.fr::after{background:linear-gradient(90deg,transparent,rgba(63,215,255,.14))}
.mode:hover{border-color:var(--signal)}.mode.fr:hover{border-color:var(--nitro)}
.mode .mk{font-family:var(--disp);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--signal)}
.mode.fr .mk{color:var(--nitro)}
.mode b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(36px,5vw,48px);line-height:.9}
.mode p{color:var(--muted);font-size:14px;line-height:1.6;max-width:44ch}
.mode .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.freegrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.freegrid{grid-template-columns:minmax(0,1fr)}}
.lgroup{display:flex;flex-direction:column;gap:8px}
.fcity{background:var(--panel);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fcity>b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:22px;line-height:1}
.ftracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ftrack{background:var(--panel2);border:1px solid var(--line);padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.ftrack[aria-pressed="true"]{border-color:var(--nitro);box-shadow:inset 0 0 0 1px var(--nitro)}
.ftrack b{font-size:14px}.ftrack small{color:var(--muted);font-size:12px}
.fset{position:sticky;top:12px}
.fname{font-family:var(--disp);font-style:italic;font-weight:800;font-size:36px;line-height:1}
/* world */
.mapbox{background:var(--panel);border:1px solid var(--line);padding:10px;overflow:hidden}
#worldMap{width:100%;height:auto;display:block}
.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.ctry{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.ctry.open{border-color:var(--nitro);cursor:pointer}
.ctry.open:hover{background:var(--panel2)}
.ctry.locked{opacity:.55}
.ctry .t{font-weight:700;font-size:18px}
.ctry .tier{font-family:var(--disp);font-weight:800;font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--muted)}
.ctry.open .tier{color:var(--nitro)}
.ctry .s{color:var(--muted);font-size:13px}

/* league */
.lhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.prog .bar{height:8px;background:var(--line);position:relative}
.prog .bar i{position:absolute;inset:0 auto 0 0;background:var(--warn)}
.prog .bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5}
.prog small{color:var(--muted);font-size:12px}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.cities{grid-template-columns:minmax(0,1fr)}}
.city{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.city .hd{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.city .hd b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:1}
.city .hd small{color:var(--muted);font-size:12px}
.city.locked .hd b{color:var(--muted)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.ev:hover:not(:disabled){background:var(--panel2)}
.ev:disabled{cursor:not-allowed;opacity:.45}
.ev .ix{font-family:var(--disp);font-size:22px;color:var(--muted);grid-row:1 / span 2}
.ev .n{font-weight:700;font-size:15px}
.ev .m{color:var(--muted);font-size:12px}
.ev .st{grid-row:1 / span 2;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stars{color:var(--warn);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.final{background:linear-gradient(100deg,#2a1206,var(--panel) 60%);border:1px solid var(--signal);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.final.locked{border-color:var(--line);background:var(--panel);opacity:.6}
.final b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:1}

/* garage */
.garage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:860px){.garage{grid-template-columns:minmax(0,1fr)}}
.bay{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bay canvas{width:100%;height:auto;display:block;background:#070a10}
.carname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.carname b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:1}
.cls{font-family:var(--disp);font-weight:800;font-size:15px;padding:2px 8px;color:#0a0e15;background:var(--fg)}
.cls.D{background:#a9b6c6}.cls.C{background:#5be38a}.cls.B{background:#3fd7ff}.cls.A{background:#c78cff}.cls.S{background:#ffb000}
.pr{margin-left:auto;font-family:var(--disp);font-size:15px;color:var(--muted)}
.pr b{font-size:28px;color:var(--fg);font-style:italic}
.spec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px 12px;align-items:center;margin:0}
.spec dt{color:var(--muted);font-size:13px}
.spec dd{margin:0}
.spec .val{font-family:var(--disp);font-size:19px;font-variant-numeric:tabular-nums;text-align:right;min-width:76px}
.meter{height:6px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--nitro)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--nitro);color:var(--nitro)}
.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.urow .nm{font-weight:700;font-size:15px}
.urow .nm span{font-family:var(--disp);color:var(--muted);font-size:14px;margin-left:4px}
.urow .ds{color:var(--muted);font-size:13px;grid-column:1}
.pips{display:flex;gap:5px;grid-column:1;align-items:center}
.pips i{width:22px;height:7px;background:var(--line);transform:skewX(-24deg);position:relative}
.pips i.on{background:var(--nitro)}
.pips i.slot::after{content:"";position:absolute;left:50%;top:-6px;width:4px;height:4px;background:var(--warn);transform:translateX(-50%) skewX(24deg) rotate(45deg)}
.urow .ubtns{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center}
.btn.dg{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:14px;padding:6px 14px}
.btn.dg:hover{color:var(--fg);border-color:var(--good)}
.srow{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.srow .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.srow .hd b{font-size:15px}
.srow .hd small{color:var(--muted);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{background:var(--panel2);border:1px dashed var(--line);padding:8px;min-height:52px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.slot b{font-size:13px;overflow-wrap:anywhere}
.slot.fill{border-style:solid}
.slot.r0{border-color:var(--r0)}.slot.r1{border-color:var(--r1)}.slot.r2{border-color:var(--r2)}
.slot.lock{cursor:not-allowed;opacity:.45;color:var(--muted)}
.slot.pick{outline:2px solid var(--fg);outline-offset:1px}
.slot small{color:var(--muted)}
.picker{background:var(--bg);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.picker .it{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.rar{font-weight:700;font-size:11px;letter-spacing:.06em}
.rar.r0{color:var(--r0)}.rar.r1{color:var(--r1)}.rar.r2{color:var(--r2)}
.cos{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border:2px solid transparent;cursor:pointer;transform:skewX(-12deg);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);outline:2px solid var(--bg);outline-offset:-4px}
.plate-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.plate-row input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:8px 10px;font:inherit;font-size:15px;width:150px}
.plate{background:#eef1f4;color:#111;font-weight:700;font-size:20px;padding:4px 16px;border:2px solid #2a2d33;letter-spacing:.06em;min-width:130px;text-align:center}

/* showroom / shop */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.car{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.car.cur{border-color:var(--nitro)}
.car.locked{opacity:.42}
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

let audio=null,muted=!save.settings.sound;
function initAudio(){if(audio)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o1=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=500;g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(ac.destination);o1.start();o2.start();audio={ac,o1,o2,f,g}}catch(e){audio=null}}
function updAudio(){if(!audio)return;const t=audio.ac.currentTime,on=(state==='race'||state==='count'||state==='finish')&&!muted;const s=clamp(speed/B,0,1.6),gp=s*5,gear=Math.min(4,Math.floor(gp)),rpm=gp-gear;const f=state==='count'?48+Math.random()*4:52+rpm*95+gear*12;

/* ---------- update */
const finishLine=()=>track.laps*trackLen+playerZ;
function update(dt){
  const st=PST||carStats(save.cur),auto=state==='menu'||state==='finish'||state==='result';
  clock+=dt;
  if(state==='count'){countT-=dt;const nn=Math.ceil(countT-0.5),t=countT>0.5?(countT>3.5?'':String(nn)):'';if(t!==lastCountShown){$('#count').textContent=t;lastCountShown=t}if(countT<=0.5){state='race';$('#banner').textContent='';pop('GO!','go')}}
  const pz=position+playerZ,pSeg=findSeg(pz),sp=speed/B;
  if(state==='race')raceTime+=dt;
  if(state!=='count'){
    if(auto){
      const ahead=findSeg(pz+SEG*6),tgt=clamp(-ahead.curve*0.06,-0.5,0.5);playerX+=(tgt-playerX)*Math.min(1,dt*2);
      const v=st.max*(state==='menu'?0.78:0.62);speed+=(v-speed)*Math.min(1,dt*0.8);
      drifting=false;nitroOn=false;offroad=false;steerVis+=(clamp(-pSeg.curve*0.15,-1,1)-steerVis)*Math.min(1,dt*4);
    }else{
      const steer=(keys.right?1:0)-(keys.left?1:0);
      drifting=!!keys.brake&&steer!==0&&sp>0.35;nitroOn=!!keys.nitro&&nitro>0.01;
      const gripNow=st.grip*TIRES[tire].grip*track.grip*(0.6+0.4*tireWear);
      const dx=dt*2*Math.min(sp,1.2);
      playerX+=dx*steer*(drifting?1.75:0.95+0.12*(gripNow-1));
      playerX-=dx*Math.min(sp,1.4)*pSeg.curve*(0.25/gripNow)*(drifting?0.7:1)*lerp(1,st.aero,clamp(sp,0,1));
      steerVis+=(steer*(drifting?1.7:1)-steerVis)*Math.min(1,dt*8);
      const vmax=st.max*(nitroOn?st.nitroPow:1);
      if(keys.brake&&!drifting)speed-=st.max*1.2*st.brake*dt;
      else if(drifting)speed-=st.max*0.09*st.drift*dt;
      else if(speed<vmax)speed=Math.min(vmax,speed+st.accel*(nitroOn?1.9:1)*dt);
      else speed=Math.max(vmax,speed-st.max*0.3*dt);
      if(pSeg.water&&Math.abs(playerX)>1.04){const side=Math.sign(playerX);playerX=side*1.04;if(speed>B*0.3){speed*=1-1.6*dt;if(Math.random()<0.4)sparks(side)}offroad=false}
      else offroad=Math.abs(playerX)>1.05;
      if(offroad&&speed>st.max*0.38)speed-=st.max*0.95*dt;
      playerX=clamp(playerX,-2.3,2.3);speed=Math.max(0,speed);
      if(nitroOn)nitro-=st.drain*dt;
      nitro=clamp(nitro+dt*(0.012+(drifting?0.17:0)),0,1);
      tireWear=Math.max(0,tireWear-dt*TIRES[tire].wear*st.wear*(0.0034+Math.abs(steer)*Math.min(sp,1)*0.004+(drifting?0.011:0)));
      if(tireWear<0.25&&!warnedTire){warnedTire=true;pop('타이어가 다 닳아 가!','warn')}
    }
    if(state==='race'){const kk=speed/B*KMH;if(kk>raceTop)raceTop=kk}
    position+=speed*dt;pDist+=speed*dt;while(position>=trackLen)position-=trackLen;
  }
  const tf=(nitroOn?114:100)+Math.min(sp,1.3)*4;fov+=(tf-fov)*Math.min(1,dt*3);camDepth=1/Math.tan(fov/2*Math.PI/180);
  skyOff+=dt*pSeg.curve*sp*0.004;
  if(state!=='count'){
    for(const c of cars){
      let tgt=c.base;const ah=findSeg(c.z+SEG*8);tgt*=1-Math.min(0.22,Math.abs(ah.curve)*0.035);

    persist();PST=carStats(save.cur);renderAll()},
  slot:v=>{const[cat,i]=v.split(':');picking=picking&&picking.cat===cat&&picking.i===+i?null:{cat,i:+i};renderGarage()},
  equip:v=>{if(!picking||!(save.inv[v]>0))return;const st=curSt(),old=st.slots[picking.cat][picking.i];if(old)save.inv[old]=(save.inv[old]||0)+1;save.inv[v]--;st.slots[picking.cat][picking.i]=v;picking=null;persist();PST=carStats(save.cur);renderAll()},
  unequip:()=>{if(!picking)return;const st=curSt(),old=st.slots[picking.cat][picking.i];if(old){save.inv[old]=(save.inv[old]||0)+1;st.slots[picking.cat][picking.i]=null}picking=null;persist();PST=carStats(save.cur);renderAll()},
  paint:v=>{curSt().paint.color=v;cosChanged()},finish:v=>{curSt().paint.finish=v;cosChanged()},
  wheel:v=>{curSt().wheel.style=v;cosChanged()},rim:v=>{curSt().wheel.color=v;cosChanged()},
  sticker:v=>{curSt().sticker.style=v;cosChanged()},stcol:v=>{curSt().sticker.color=v;cosChanged()},
  buycar:v=>{const c=CAR[v];if(save.owned[v]||save.money<c.price||carLocked(c))return;save.money-=c.price;save.owned[v]=newCar(v);save.cur=v;persist();attract();renderAll()},
  set:v=>{const[k,val]=v.split(':');const st=save.settings;st[k]=val==='true'?true:val==='false'?false:val;persist();
    if(k==='sound')syncMute();if(k==='quality'){DRAW=qDraw();resize()}renderSettings()},
  reset:()=>{resetAsk=true;renderSettings()},resetno:()=>{resetAsk=false;renderSettings()},
  resetyes:()=>{save=normalize(null);persist();resetAsk=false;attract();setTab('world')},
  profile:()=>{delAsk=false;setTab('profile')},
  guest:()=>enterGuest(),
  photonew:()=>pickPhoto(d=>{newPhoto=d;if($('#photoBox'))$('#photoBox').innerHTML=photoBoxHTML(newPhoto)}),
  photoclrnew:()=>{newPhoto=null;if($('#photoBox'))$('#photoBox').innerHTML=photoBoxHTML(newPhoto)},
  photoset:()=>pickPhoto(d=>{me().photo=d;saveAccounts();renderTop();renderProfile()}),
  photoclr:()=>{me().photo=null;saveAccounts();renderTop();renderProfile()},
  guestsignup:()=>{const gs=save;showLogin();loginMode='new';guestSave=gs;renderLogin()},
  loginhome:()=>{loginMode='home';loginErr='';guestSave=null;renderLogin()},loginsignin:()=>{loginMode='signin';loginErr='';renderLogin()},loginnew:()=>{loginMode='new';loginErr='';renderLogin()},
  newicon:v=>{newIcon=+v;const n=($('#nickIn')||{}).value||'';renderLogin();if($('#nickIn'))$('#nickIn').value=n},
  seticon:v=>{me().icon=+v;saveAccounts();renderTop();renderProfile()},
  logout:()=>{persist();guestSave=null;try{sessionStorage.removeItem(SESS_KEY)}catch(e){}showLogin()},
  delask:()=>{delAsk=true;renderProfile()},delno:()=>{delAsk=false;renderProfile()},
  buyitem:v=>{const p=RAR[SPEC[v].rar].price;if(save.money<p)return;save.money-=p;save.inv[v]=(save.inv[v]||0)+1;persist();renderAll()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='plateIn'){const v=e.target.value.slice(0,8);curSt().plate=v;persist();LOOK=myLook();$('#platePrev').textContent=v||' ';drawGarageCar()}});
$('#pauseBtn').onclick=pause;
function syncMute(){muted=!save.settings.sound;$('#muteBtn').textContent=muted?'소리 꺼짐':'소리 켜짐'}
syncMute();
$('#muteBtn').onclick=()=>{save.settings.sound=!save.settings.sound;persist();syncMute()};

/* ---------- input */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'brake',KeyS:'brake',Space:'nitro',ShiftLeft:'nitro',ShiftRight:'nitro',ArrowUp:'nitro',KeyW:'nitro'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='paused')resume();else pause();return}
  const k=KEYMAP[e.code];if(k&&(state==='race'||state==='count')){keys[k]=1;e.preventDefault()}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=0});
document.querySelectorAll('.touch button').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}},off=()=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- boot */
function resize(){DPR=Math.min(window.devicePixelRatio||1,DPRQ[save.settings.quality]||1.5);W=cv.width=Math.max(1,Math.round(cv.clientWidth*DPR));H=cv.height=Math.max(1,Math.round(cv.clientHeight*DPR));buildBg()}
addEventListener('resize',resize);
resize();
(()=>{let sid=null;try{sid=sessionStorage.getItem(SESS_KEY)}catch(e){}if(sid&&accounts.users[sid])enterGame(sid);else showLogin()})();
setInterval(()=>{if(uid&&tab==='profile'&&!$('#sHub').hidden){const el=$('#pProf .profhead > .keys');if(el)el.textContent='자동 저장됨 · '+ago(lastSaved)}},20000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(tab==='world'&&!leagueOpen)drawWorld();drawGarageCar()});
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(state!=='paused'){update(dt);render()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
